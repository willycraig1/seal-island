<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c4a7e">
<title>Seal Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>

  canvas{display:block;touch-action:none}

<body>
<canvas id="c"></canvas>
<script>
/*
  Seal Island — silly seals on an iceberg.
  One self-contained file: all art is drawn in code and every sound
  (honks, boings, farts, sad trombones) is synthesized with Web Audio.
*/
'use strict';

// ---------- tiny helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const lin = t => t, eIn = t => t * t, eOut = t => 1 - (1 - t) * (1 - t), eIO = t => t * t * (3 - 2 * t);
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const FONT = '"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
const GCOL = '#94877b';            // Gerald's colour
const SEAL_COLS = ['#7d8e9e', '#a9b7c4', '#8b9dae', '#6f7f8f', '#b8a99a', '#9aa7b0', '#c2b8ae', '#8e9fb5'];

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(hex, amt) {
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  const [r, g, b] = hexRgb(hex); return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function mix(h1, h2, t) {
  const a = hexRgb(h1), b = hexRgb(h2);
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')';
}

// ---------- save data ----------
const SAVE_KEY = 'sealIsland.v1';
const save = { fish: 0, bestSlide: 0, bestStack: 0, bestLaunch: 0, bestChoir: 0, bestCatch: 0, bestBalance: 0, bestSealy: 0, sumoWins: 0, pearlDist: 120, muted: false, owned: [], outfit: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- canvas / scaling ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, SCALE = 1, W = 960, H = 600, portrait = false;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth || 960, ch = window.innerHeight || 600;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  portrait = ch > cw * 1.05;
  SCALE = ch / 600; W = cw / SCALE;
  if (W < 800) { SCALE = cw / 800; W = 800; }
  H = ch / SCALE;
}
window.addEventListener('resize', resize);
resize();

// =====================================================================
//  SOUND — everything synthesized, no audio files
// =====================================================================
const S = {
  ctx: null, out: null, noise: null, muted: save.muted,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      this.out = this.ctx.createGain(); this.out.gain.value = 0.7;
      const comp = this.ctx.createDynamicsCompressor();
      this.out.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  ok() { return this.ctx && !this.muted; },
  now(dl) { return this.ctx.currentTime + 0.01 + (dl || 0); },
  o(type, f, t, dur) { const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + 0.1); return o; },
  g(v) { const g = this.ctx.createGain(); g.gain.value = v; return g; },
  f(type, fr, q) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = fr; if (q != null) b.Q.value = q; return b; },
  n(t, dur) { const n = this.ctx.createBufferSource(); n.buffer = this.noise; n.loop = true; n.start(t, Math.random() * 1.5); n.stop(t + dur + 0.1); return n; },
  env(g, t, a, p, h, r) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p, t + a);
    g.gain.setValueAtTime(p, t + a + h); g.gain.exponentialRampToValueAtTime(0.0001, t + a + h + r);
  },

  fart(kind, dl) {
    if (!this.ok()) return; const t = this.now(dl);
    kind = kind || pick(['long', 'short', 'squeaky', 'tuba', 'rip', 'long']);
    const P = {
      short:   [rand(.18, .3), rand(95, 140), .7, rand(18, 26), 950],
      squeaky: [rand(.45, .7), rand(170, 240), 2, rand(24, 34), 2400],
      tuba:    [rand(.9, 1.3), rand(52, 68), .75, rand(11, 16), 650],
      rip:     [rand(.5, .8), rand(105, 150), .55, rand(32, 46), 1500],
      long:    [rand(.6, 1), rand(72, 100), .65, rand(15, 23), 850]
    }[kind] || [.6, 90, .65, 18, 850];
    const [len, b, end, fl, cut] = P;
    const o = this.o('sawtooth', b * 1.15, t, len);
    o.frequency.exponentialRampToValueAtTime(b, t + len * .3);
    o.frequency.exponentialRampToValueAtTime(b * end, t + len);
    const w = this.o('sine', rand(3, 7), t, len), wg = this.g(b * .12); w.connect(wg); wg.connect(o.frequency);
    const lp = this.f('lowpass', cut, 4);
    const am = this.g(.55), q = this.o('square', fl, t, len), qg = this.g(.45); q.connect(qg); qg.connect(am.gain);
    const nz = this.n(t, len), bp = this.f('bandpass', b * 3, 2), ng = this.g(0); this.env(ng, t, .02, .25, len * .5, len * .45);
    const g = this.g(0); this.env(g, t, .02, .9, len * .6, len * .35);
    o.connect(lp); lp.connect(am); nz.connect(bp); bp.connect(ng); ng.connect(am); am.connect(g); g.connect(this.out);
  },
  honk(p = 1, dl) {
    if (!this.ok()) return; const t = this.now(dl), f = rand(240, 290) * p, d = .2;
    const bp = this.f('bandpass', 1000 * Math.sqrt(p), 1.2), g = this.g(0); this.env(g, t, .012, .45, d * .45, d * .5);
    for (const k of [1, 1.013]) { const o = this.o('square', f * 1.1 * k, t, d); o.frequency.exponentialRampToValueAtTime(f * .9 * k, t + d); o.connect(bp); }
    bp.connect(g); g.connect(this.out);
  },
  honk2(p = 1, dl = 0) { this.honk(p, dl); this.honk(p * 1.05, dl + .2); },
  boing(dl, p = 1) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 110 * p, t, .6); o.frequency.exponentialRampToValueAtTime(480 * p, t + .07);
    const v = this.o('sine', 13, t, .6), vg = this.g(55 * p); v.connect(vg); vg.connect(o.frequency);
    const g = this.g(0); this.env(g, t, .005, .45, .05, .5); o.connect(g); g.connect(this.out);
  },
  bonk(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 520, t, .25); o.frequency.exponentialRampToValueAtTime(70, t + .18);
    const g = this.g(0); this.env(g, t, .003, .7, .02, .22); o.connect(g); g.connect(this.out);
    const o2 = this.o('triangle', 1400, t, .08); o2.frequency.exponentialRampToValueAtTime(300, t + .06);
    const g2 = this.g(0); this.env(g2, t, .002, .25, .01, .05); o2.connect(g2); g2.connect(this.out);
  },
  splash(dl, big = 1) {
    if (!this.ok()) return; const t = this.now(dl), d = .55 * big;
    const nz = this.n(t, d + .1), lp = this.f('lowpass', 4500, .7);
    lp.frequency.setValueAtTime(4500, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
    const g = this.g(0); this.env(g, t, .004, .55 * Math.min(1, big), .04, d);
    nz.connect(lp); lp.connect(g); g.connect(this.out);
    for (let i = 0; i < 4; i++) {
      const tt = t + .12 + i * rand(.05, .1), f = rand(350, 700);
      const o = this.o('sine', f, tt, .08); o.frequency.exponentialRampToValueAtTime(f * 2.2, tt + .06);
      const gg = this.g(0); this.env(gg, tt, .004, .18, .01, .05); o.connect(gg); gg.connect(this.out);
    }
  },
  whistle(up = true, dl, dur = .6) {
    if (!this.ok()) return; const t = this.now(dl), a = up ? 380 : 1500, b = up ? 1500 : 320;
    const o = this.o('sine', a, t, dur); o.frequency.exponentialRampToValueAtTime(b, t + dur);
    const v = this.o('sine', 6, t, dur), vg = this.g(18); v.connect(vg); vg.connect(o.frequency);
    const g = this.g(0); this.env(g, t, .03, .28, Math.max(.01, dur - .1), .08); o.connect(g); g.connect(this.out);
  },
  pop(dl, p = 1) {
    if (!this.ok()) return; const t = this.now(dl);
    [[700, 0], [1050, .06]].forEach(([f, st]) => {
      const o = this.o('square', f * p, t + st, .1), lp = this.f('lowpass', 3000), g = this.g(0);
      this.env(g, t + st, .003, .16, .03, .05); o.connect(lp); lp.connect(g); g.connect(this.out);
    });
  },
  sad(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (const [f, st, d] of [[233, 0, .42], [220, .45, .42], [208, .9, .42], [196, 1.35, 1.4]]) {
      const tt = t + st, o = this.o('sawtooth', f, tt, d), o2 = this.o('sawtooth', f * 1.006, tt, d);
      const lp = this.f('lowpass', 500, 3);
      lp.frequency.setValueAtTime(400, tt); lp.frequency.linearRampToValueAtTime(1500, tt + .12); lp.frequency.linearRampToValueAtTime(700, tt + d);
      const g = this.g(0); this.env(g, tt, .04, .32, d * .65, d * .3);
      if (d > 1) {
        const v = this.o('sine', 5.5, tt, d), vg = this.g(0);
        vg.gain.setValueAtTime(0, tt); vg.gain.linearRampToValueAtTime(7, tt + .4);
        v.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
      }
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.out);
    }
  },
  hmph(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('square', 330, t, .22); o.frequency.exponentialRampToValueAtTime(190, t + .2);
    const bp = this.f('bandpass', 800, 2), g = this.g(0); this.env(g, t, .01, .35, .07, .12);
    o.connect(bp); bp.connect(g); g.connect(this.out);
    const nz = this.n(t, .2), hp = this.f('highpass', 1200), ng = this.g(0); this.env(ng, t, .01, .12, .05, .1);
    nz.connect(hp); hp.connect(ng); ng.connect(this.out);
  },
  kiss(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 280, t, .1); o.frequency.exponentialRampToValueAtTime(1300, t + .06);
    const g = this.g(0); this.env(g, t, .002, .35, .02, .06); o.connect(g); g.connect(this.out);
    const nz = this.n(t + .06, .05), hp = this.f('highpass', 3000), ng = this.g(0); this.env(ng, t + .06, .001, .2, .005, .03);
    nz.connect(hp); hp.connect(ng); ng.connect(this.out);
  },
  love(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    [784, 988, 1175, 1568].forEach((f, i) => {
      const o = this.o('sine', f, t + i * .09, .3), g = this.g(0);
      this.env(g, t + i * .09, .005, .18, .05, .2); o.connect(g); g.connect(this.out);
    });
  },
  gasp(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const nz = this.n(t, .25), bp = this.f('bandpass', 1600, .8), g = this.g(0); this.env(g, t, .12, .3, .05, .04);
    nz.connect(bp); bp.connect(g); g.connect(this.out);
    const o = this.o('sine', 500, t, .18); o.frequency.exponentialRampToValueAtTime(850, t + .15);
    const g2 = this.g(0); this.env(g2, t, .05, .12, .05, .05); o.connect(g2); g2.connect(this.out);
  },
  crunch(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const nz = this.n(t, .5), lp = this.f('lowpass', 1100), g = this.g(0); this.env(g, t, .003, .8, .06, .3);
    nz.connect(lp); lp.connect(g); g.connect(this.out);
  },
  swish(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const nz = this.n(t, .2), bp = this.f('bandpass', 800, 1.5);
    bp.frequency.setValueAtTime(800, t); bp.frequency.exponentialRampToValueAtTime(3000, t + .15);
    const g = this.g(0); this.env(g, t, .02, .18, .04, .08); nz.connect(bp); bp.connect(g); g.connect(this.out);
  },
  squawk(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (let k = 0; k < 2; k++) {
      const tt = t + k * .2, o = this.o('sawtooth', 1050, tt, .16); o.frequency.exponentialRampToValueAtTime(620, tt + .15);
      const v = this.o('sine', 35, tt, .16), vg = this.g(90); v.connect(vg); vg.connect(o.frequency);
      const bp = this.f('bandpass', 1600, 2), g = this.g(0); this.env(g, tt, .01, .22, .06, .09);
      o.connect(bp); bp.connect(g); g.connect(this.out);
    }
  },
  sneeze(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (const [st, f0, f1] of [[0, 280, 420], [.32, 320, 520]]) {
      const o = this.o('triangle', f0, t + st, .25); o.frequency.exponentialRampToValueAtTime(f1, t + st + .22);
      const g = this.g(0); this.env(g, t + st, .03, .25, .12, .08); o.connect(g); g.connect(this.out);
    }
    const tc = t + .65, nz = this.n(tc, .45), bp = this.f('bandpass', 2200, .8), g = this.g(0);
    this.env(g, tc, .005, .9, .08, .3); nz.connect(bp); bp.connect(g); g.connect(this.out);
    const o = this.o('square', 260, tc, .25); o.frequency.exponentialRampToValueAtTime(140, tc + .25);
    const lp = this.f('lowpass', 1200), g2 = this.g(0); this.env(g2, tc, .005, .3, .05, .15);
    o.connect(lp); lp.connect(g2); g2.connect(this.out);
  },
  fanfare(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    [523, 659, 784, 1047].forEach((f, i) => {
      const d = i === 3 ? .55 : .13, tt = t + i * .13, o = this.o('square', f, tt, d), lp = this.f('lowpass', 2600), g = this.g(0);
      this.env(g, tt, .005, .2, d * .6, d * .4); o.connect(lp); lp.connect(g); g.connect(this.out);
    });
  },
  tap(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 660, t, .07); o.frequency.exponentialRampToValueAtTime(880, t + .06);
    const g = this.g(0); this.env(g, t, .002, .15, .02, .04); o.connect(g); g.connect(this.out);
  },
  chaching(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const nz = this.n(t, .12), hp = this.f('highpass', 4000), ng = this.g(0); this.env(ng, t, .002, .35, .02, .08);
    nz.connect(hp); hp.connect(ng); ng.connect(this.out);
    [[1319, .06], [1760, .14]].forEach(([f, st]) => {
      const o = this.o('square', f, t + st, .35), lp = this.f('lowpass', 4000), g = this.g(0);
      this.env(g, t + st, .003, .2, .05, .3); o.connect(lp); lp.connect(g); g.connect(this.out);
    });
    for (let i = 0; i < 5; i++) {
      const tt = t + .2 + i * .05, o = this.o('sine', 2000 + i * 300, tt, .1), g = this.g(0);
      this.env(g, tt, .002, .08, .02, .06); o.connect(g); g.connect(this.out);
    }
  },
  nope(dl) { this.honk(.7, dl); this.honk(.58, (dl || 0) + .2); },
  clown(dl) { this.honk(1.7, dl); this.honk(1.45, (dl || 0) + .16); },
  partyHorn(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sawtooth', 420, t, .6); o.frequency.exponentialRampToValueAtTime(560, t + .1);
    const v = this.o('sine', 18, t, .6), vg = this.g(14); v.connect(vg); vg.connect(o.frequency);
    const bp = this.f('bandpass', 1400, 1.5), g = this.g(0); this.env(g, t, .02, .3, .4, .15);
    o.connect(bp); bp.connect(g); g.connect(this.out);
  },
  whirr(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sawtooth', 30, t, .8); o.frequency.exponentialRampToValueAtTime(110, t + .5);
    const lp = this.f('lowpass', 600, 2), g = this.g(0); this.env(g, t, .05, .35, .5, .2);
    o.connect(lp); lp.connect(g); g.connect(this.out);
  },
  flop(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const nz = this.n(t, .2), lp = this.f('lowpass', 900), g = this.g(0); this.env(g, t, .002, .6, .02, .15);
    nz.connect(lp); lp.connect(g); g.connect(this.out);
    const o = this.o('sine', 160, t, .2); o.frequency.exponentialRampToValueAtTime(60, t + .15);
    const g2 = this.g(0); this.env(g2, t, .002, .5, .02, .12); o.connect(g2); g2.connect(this.out);
  },
  stretch(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sawtooth', 70, t, .5); o.frequency.exponentialRampToValueAtTime(150, t + .45);
    const lp = this.f('lowpass', 500, 4), g = this.g(0); this.env(g, t, .05, .15, .3, .1);
    o.connect(lp); lp.connect(g); g.connect(this.out);
  },
  gulp(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 320, t, .16); o.frequency.exponentialRampToValueAtTime(110, t + .13);
    const g = this.g(0); this.env(g, t, .005, .5, .03, .1); o.connect(g); g.connect(this.out);
  },
  squeakToy(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (const st of [0, .13]) {
      const o = this.o('sine', 1100, t + st, .1); o.frequency.exponentialRampToValueAtTime(1600, t + st + .08);
      const g = this.g(0); this.env(g, t + st, .005, .3, .04, .05); o.connect(g); g.connect(this.out);
    }
  },
  clank(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (const f of [900, 1340, 2100]) {
      const o = this.o('triangle', f, t, .35), g = this.g(0); this.env(g, t, .002, .18, .01, .3); o.connect(g); g.connect(this.out);
    }
  },
  bloop(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    const o = this.o('sine', 200, t, .14); o.frequency.exponentialRampToValueAtTime(700, t + .12);
    const g = this.g(0); this.env(g, t, .005, .22, .03, .08); o.connect(g); g.connect(this.out);
  },
  note(f, dl) {
    if (!this.ok()) return; const t = this.now(dl), d = .38;
    const bp = this.f('bandpass', f * 3, 1.1), g = this.g(0); this.env(g, t, .015, .5, d * .5, d * .5);
    for (const k of [1, 1.008]) { const o = this.o('square', f * .9 * k, t, d); o.frequency.exponentialRampToValueAtTime(f * k, t + .05); o.connect(bp); }
    bp.connect(g); g.connect(this.out);
  },
  cheer(dl) {
    if (!this.ok()) return; const t = this.now(dl);
    for (let i = 0; i < 10; i++) {
      const tt = t + i * rand(.04, .09), nz = this.n(tt, .25), bp = this.f('bandpass', rand(900, 2600), 3), g = this.g(0);
      this.env(g, tt, .02, .12, .08, .12); nz.connect(bp); bp.connect(g); g.connect(this.out);
    }
    this.whistle(true, (dl || 0) + .1, .35); this.whistle(true, (dl || 0) + .4, .3);
  },

    nose: () => S.clown(dl), googly: () => S.boing(dl, 1.6), pirate: () => S.honk(.62, dl) }[id];
  if (f) f(); else S.pop(dl);
}

function hitSeal(s, x, y) { const w = 85 * s.s, h = 90 * s.s; return x > s.x - w && x < s.x + w && y > s.y - h && y < s.y + 12; }

function sealTick(s, dt, t, P) {
  s.blink -= dt; if (s.blink <= 0) { s.blink = rand(2, 5); s.blinkT = .13; }
  if (s.blinkT > 0) s.blinkT -= dt;
  s.bsq = s.anim || s.walk ? 0 : Math.sin(t * 2.2 + s.ph) * .018;
  if (s.walk) s.dy = -Math.abs(Math.sin(t * 16)) * 9;
  if (s.shake > 0) { s.shake -= dt; s.sq = Math.sin(t * 55) * .07 * Math.max(0, s.shake); if (s.shake <= 0) s.sq = 0; }
  updAnim(s, dt, P);
}
function updAnim(s, dt, P) {
  const a = s.anim; if (!a) return;
  a.t += dt; const p = Math.min(1, a.t / a.dur), d = s.flip ? -1 : 1;
  switch (a.type) {
    case 'hop': s.dy = -Math.sin(p * Math.PI) * 45 * s.s; s.sq = p > .85 ? .12 : -.04; break;
    case 'honk': s.mouth = 'o'; s.rot = -.2 * Math.sin(p * Math.PI); break;
    case 'fart': s.sq = Math.sin(a.t * 45) * .06 * (1 - p); s.blush = 1 - p; s.eyes = 'wide'; s.mouth = 'o'; break;
    case 'spin': s.dy = -Math.sin(p * Math.PI) * 60 * s.s; s.rot = -p * TAU; break;
    case 'sneeze':
      if (p < .55) { s.rot = -.25 * eIO(p / .55); s.eyes = 'closed'; s.mouth = 'o'; }
      else if (p < .65) { s.rot = lerp(-.25, .35, (p - .55) / .1); s.sq = .08; }
      else { s.rot = .35 * (1 - eIO((p - .65) / .35)); s.sq = 0; s.eyes = 'wide'; s.mouth = 'smile'; }
      if (!a.f && p >= .55) {
        a.f = 1;
        for (let i = 0; i < 14; i++) P.add({ k: 'drop', x: s.x + d * 72 * s.s, y: s.y - 45 * s.s, vx: d * rand(200, 520), vy: rand(-160, 40), g: 500, s: rand(2, 4.5), life: .7, col: '#e3f6ff' });
      }
      break;
    case 'blush': s.eyes = 'wide'; s.mouth = 'o'; s.blush = 1 - p * .5; s.sq = Math.sin(a.t * 40) * .04; break;
    case 'laugh': s.eyes = 'closed'; s.mouth = 'grin'; s.dy = -Math.abs(Math.sin(a.t * 16)) * 10; break;
    case 'hmph': s.eyes = 'half'; s.flip = !s.baseFlip; s.rot = -.15; break;
    case 'heart': s.eyes = 'heart'; break;
    case 'sing': s.mouth = 'o'; s.rot = -.2 * Math.sin(p * Math.PI); s.sq = -.1 * Math.sin(p * Math.PI); break;
    case 'sad': s.eyes = 'closed'; s.mouth = 'frown'; s.sq = .04; break;
  }
  if (a.t >= a.dur) { s.anim = null; s.dy = 0; s.rot = 0; s.sq = 0; s.eyes = 'n'; s.mouth = 'smile'; s.blush = 0; s.flip = s.baseFlip; }
}
function react(s, P, type) {
  type = type || pick(['fart', 'fart', 'honk', 'hop', 'spin', 'sneeze']);
  const dur = { hop: .55, honk: .55, fart: 1, spin: .8, sneeze: 1.2, blush: 1.2, laugh: 1, hmph: 1.3, heart: 1.4 }[type];
  s.anim = { type, t: 0, dur };
  const d = s.flip ? -1 : 1, pitch = s.s < .8 ? 1.5 : s.s > 1.05 ? .72 : 1;
  switch (type) {
    case 'fart': S.fart(s.s < .8 ? 'squeaky' : s.s > 1.05 ? 'tuba' : null); fartCloud(P, s.x - d * 78 * s.s, s.y - 18 * s.s, d, 8, s.s > 1.05); break;
    case 'honk': S.honk2(pitch); for (let i = 0; i < 2; i++) P.add({ k: 'note', x: s.x + d * 50 * s.s, y: s.y - 80 * s.s, vx: d * rand(20, 60), vy: -rand(60, 100), life: 1.1, s: 28 }); break;
    case 'hop': S.boing(0, pitch); break;
    case 'spin': S.whistle(true, 0, .5); break;
    case 'sneeze': S.sneeze(); break;
    case 'laugh': S.honk(pitch * .9); S.honk(pitch, .17); S.honk(pitch * 1.1, .34); break;
    case 'hmph': S.hmph(); break;
    case 'heart': S.love(); hearts(P, s.x + d * 30 * s.s, s.y - 80 * s.s, 4); break;
  }
}

// ---------- particles ----------
class Parts {
  constructor() { this.a = []; }
  add(p) {
    if (this.a.length > 220) this.a.shift();
    p.t = 0; p.life = p.life || 1; p.vx = p.vx || 0; p.vy = p.vy || 0; p.g = p.g || 0; p.r = p.r || 0; p.vr = p.vr || 0; p.s = p.s || 10;
    this.a.push(p); return p;
  }
  update(dt) {
    for (let i = this.a.length - 1; i >= 0; i--) {
      const p = this.a[i]; if (!p) continue;
      p.t += dt; if (p.t >= p.life) { this.a.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
      if (p.seaY != null && p.vy > 0 && p.y > p.seaY) { p.t = p.life; if (p.onSea) p.onSea(p); }
    }
  }
  draw(c) {
    for (const p of this.a) {
      const k = p.t / p.life;
      c.globalAlpha = p.fade === false ? 1 : clamp((1 - k) * 1.6, 0, 1);
      switch (p.k) {
        case 'heart': heart(c, p.x, p.y, p.s, p.col || '#ff4d7a'); break;
        case 'cloud': {
          const r = p.s * (.6 + k * 1.3); c.fillStyle = p.col || '#9ccc4a'; c.beginPath();
          c.arc(p.x, p.y, r, 0, TAU); c.moveTo(p.x + r * 1.3, p.y - r * .3); c.arc(p.x + r * .6, p.y - r * .3, r * .7, 0, TAU);
          c.moveTo(p.x - r * .1, p.y - r * .2); c.arc(p.x - r * .7, p.y - r * .2, r * .6, 0, TAU); c.fill(); break;
        }
        case 'drop': c.fillStyle = p.col || '#bfe6ff'; c.beginPath(); c.arc(p.x, p.y, p.s, 0, TAU); c.fill(); break;
        case 'snow': c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x, p.y, p.s, 0, TAU); c.fill(); break;
        case 'star':
          c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col || '#ffd43b'; c.beginPath();
          for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? p.s * .45 : p.s; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
          c.closePath(); c.fill(); c.restore(); break;
        case 'fish': fish(c, p.x, p.y, p.s, p.col, p.r); break;
        case 'text': txt(c, p.str, p.x, p.y, p.s, p.col || '#fff'); break;
        case 'note': txt(c, '♪', p.x, p.y, p.s, p.col || '#fff'); break;
        case 'ring': {
          const e = 1 + k * 2.5; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3;
          c.beginPath(); c.ellipse(p.x, p.y, p.s * e, p.s * .3 * e, 0, 0, TAU); c.stroke(); break;
        }
        case 'bubble': c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.s, 0, TAU); c.stroke(); break;
      }
    }
    c.globalAlpha = 1;
  }
}

// ---------- timers & tweens ----------
class TQ {
  constructor() { this.q = []; this.tw = []; }
  add(d, fn) { this.q.push({ d, fn }); }
  tween(o, k, to, dur, delay = 0, ez = eIO) { this.tw.push({ o, k, to, dur, delay, t: 0, ez, from: null }); }
  update(dt) {
    const due = [];
    for (let i = this.q.length - 1; i >= 0; i--) { const e = this.q[i]; e.d -= dt; if (e.d <= 0) { this.q.splice(i, 1); due.push(e); } }
    due.sort((a, b) => a.d - b.d).forEach(e => e.fn());
    for (let i = this.tw.length - 1; i >= 0; i--) {
      const w = this.tw[i]; if (w.delay > 0) { w.delay -= dt; if (w.delay > 0) continue; }
      if (w.from === null) w.from = w.o[w.k];
      w.t += dt; const k = Math.min(1, w.t / w.dur); w.o[w.k] = w.from + (w.to - w.from) * w.ez(k);
      if (k >= 1) this.tw.splice(i, 1);
    }
  }
  clear() { this.q.length = 0; this.tw.length = 0; }
}

// ---------- buttons ----------
class Btn {
  constructor(o) { Object.assign(this, { x: 0, y: 0, w: 100, h: 60, col: '#3fb950', round: false, press: 0, bob: null }, o); this.dk = shade(this.col, -.3); }
  hit(px, py) { const y = this.y + this.oy(); return px >= this.x - this.w / 2 && px <= this.x + this.w / 2 && py >= y - this.h / 2 && py <= y + this.h / 2; }
  oy() { return this.bob != null ? Math.sin(now * 2 + this.bob) * 4 : 0; }
  draw(c, t) {
    this.press = Math.max(0, this.press - 1 / 60 * 4);
    const s = 1 - this.press * .08, w = this.w, h = this.h, r = this.round ? h / 2 : Math.min(26, h * .3);
    c.save(); c.translate(this.x, this.y + this.oy()); c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, -w / 2, -h / 2 + 8, w, h, r); c.fill();
    c.fillStyle = this.dk; rr(c, -w / 2, -h / 2 + 4, w, h, r); c.fill();
    c.fillStyle = this.col; rr(c, -w / 2, -h / 2, w, h - 2, r); c.fill();
    c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, -w / 2 + 8, -h / 2 + 5, w - 16, h * .32, r * .7); c.fill();
    if (this.art) this.art(c, w, h, t);
    if (typeof this.icon === 'string') icon(c, this.icon, Math.min(w, h) * .5);
    if (this.label) txt(c, this.label, 0, 0, this.fs || 24, '#fff', 'center', 'rgba(0,0,0,.25)', 5);
    c.restore();
  }
}

    const g = this.g;
    if (this.state === 'aim') {
      const p = this.pull(), len = Math.hypot(p.dx, p.dy);
      this.px = LX + p.dx; this.py = GY - 120 + p.dy;
      g.eyes = len > 90 ? 'wide' : 'n'; g.mouth = len > 90 ? 'o' : 'smile';
      g.rot = len > 10 ? Math.atan2(-p.dy, -p.dx) * .6 : 0;
    } else if (this.state === 'fly') {
      this.vy += 1400 * dt; this.vx -= this.vx * .12 * dt; this.px += this.vx * dt; this.py += this.vy * dt;
      if (this.py >= GY) {
        this.py = GY;
        if (this.vy > 260) {
          this.vy = -this.vy * .4; this.vx *= .72; g.sq = .25; S.flop();
          for (let i = 0; i < 8; i++) this.P.add({ k: 'snow', x: this.px + rand(-40, 40), y: GY - 4, vx: rand(-120, 200), vy: -rand(100, 300), g: 900, s: rand(3, 6), life: .8 });
        } else { this.vy = 0; this.onGround = true; }
      } else this.onGround = false;
      if (this.onGround) {
        this.vx = Math.max(0, this.vx - 460 * dt); g.rot += (.05 - g.rot) * Math.min(1, dt * 10);
        if (this.vx > 60 && Math.random() < dt * 20) this.P.add({ k: 'snow', x: this.px - 60, y: GY - 6, vx: -rand(40, 120), vy: -rand(60, 160), g: 700, s: rand(2, 4), life: .5 });
      } else g.rot = clamp(Math.atan2(this.vy, this.vx) * .8, -1.2, 1.3);
      if (g.sq > 0) g.sq = Math.max(0, g.sq - dt * 1.5);
      this.collide();
      if (!this.near && this.px > this.pearlX - 450) this.nearPearl();
      if (!this.passed && this.px > this.pearlX) this.passPearl();
      if (this.onGround && this.vx < 6) this.stop();
    }
    if (this.snap > 0) this.snap = Math.max(0, this.snap - dt * 2);
    const tx = Math.max(0, this.px - W * .35), ty = Math.min(0, this.py - 250);
    this.camX += (tx - this.camX) * Math.min(1, dt * 6); this.camY += (ty - this.camY) * Math.min(1, dt * 4);
    this.gen();
    for (const o of this.objs) {
      if (o.comp > 0) o.comp = Math.max(0, o.comp - dt * 3);
      if (o.sq > 0) o.sq = Math.max(0, o.sq - dt * 1.5);
      if (o.fly) { o.fly.vy += 1500 * dt; o.x += o.fly.vx * dt; o.fy += o.fly.vy * dt; o.fr += o.fly.vr * dt; }
      if (o.k === 'walrus' && !o.awake && o.x < this.camX + W + 100) {
        o.z -= dt; if (o.z <= 0) { o.z = 1.4; this.P.add({ k: 'text', str: 'z', x: o.x - 40, y: GY - 110, vx: 25, vy: -45, life: 1.6, s: 28, col: '#ffffff' }); }
      }
    }
    sealTick(g, dt, this.t, this.P); sealTick(this.pearl, dt, this.t, this.P);
    if (this.hintT > 0) this.hintT -= dt;
  },
  drawSling(c, front) {
    const lx = LX - 34, rx = LX + 34, top = GY - 150, x = front ? rx : lx;
    c.fillStyle = '#a9d8f0'; c.beginPath(); c.moveTo(x - 14, GY + 4); c.lineTo(x - 5, top - 10); c.lineTo(x + 5, top - 10); c.lineTo(x + 14, GY + 4); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(x - 8, GY); c.lineTo(x - 3, top); c.lineTo(x, top); c.lineTo(x - 2, GY); c.closePath(); c.fill();
    const pouch = this.state === 'aim' ? [this.px - 10, this.py - 30] : [LX + Math.sin(this.t * 40) * 14 * this.snap, top + 20];
    c.strokeStyle = '#e64980'; c.lineWidth = 7; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, top); c.lineTo(pouch[0], pouch[1]); c.stroke();
  },
  draw(c) {
    const t = this.t, cx = this.camX, cy = this.camY, hgt = clamp(-cy / 700, 0, 1), g = this.g;
    drawSky(c, H, mix('#7ec8f0', '#4a7fc4', hgt), mix('#d4f1ff', '#a9d4f5', hgt));
    drawSun(c, W - 120, 90 - cy * .1);
    drawClouds(c, t * .5 - cx * .08, 30 - cy * .3);
    // distant mountains
    const by = GY - 40 - cy, mo = (cx * .15) % 400;
    c.fillStyle = '#cfe6f5'; c.beginPath(); c.moveTo(0, by);
    for (let x = -mo - 400; x < W + 400; x += 400) { c.lineTo(x + 80, by - 90); c.lineTo(x + 150, by - 55); c.lineTo(x + 240, by - 120); c.lineTo(x + 400, by); }
    c.lineTo(W, by); c.lineTo(W, by + 60); c.lineTo(0, by + 60); c.closePath(); c.fill();
    c.save(); c.translate(-cx, -cy);
    // ice sheet
    const gh = cy + H - GY + 20;
    if (gh > 0) {
      c.fillStyle = '#dcefff'; c.fillRect(cx - 10, GY, W + 20, gh);
      c.fillStyle = '#ffffff'; c.fillRect(cx - 10, GY - 2, W + 20, 12);
      c.strokeStyle = 'rgba(140,185,215,.5)'; c.lineWidth = 2;
      for (let i = Math.floor(cx / 140); i < (cx + W) / 140 + 1; i++) {
        const r = Math.abs(Math.sin(i * 91.7) * 4375.5) % 1, x = i * 140 + r * 60, y = GY + 24 + r * 70;
        c.beginPath(); c.moveTo(x - 20, y); c.lineTo(x - 4, y + 3); c.lineTo(x + 18, y - 2); c.stroke();
      }
      // distance posts
      for (let m = Math.max(10, Math.ceil((cx - LX) / PXM / 10) * 10); LX + m * PXM < cx + W + 60; m += 10) {
        const x = LX + m * PXM;
        if (m % 50 === 0) {
          c.fillStyle = '#7a4b2a'; c.fillRect(x - 3, GY - 70, 6, 72);
          c.fillStyle = '#fff'; rr(c, x - 38, GY - 96, 76, 34, 10); c.fill();
          txt(c, m + ' m', x, GY - 79, 22, '#1c7ed6', 'center', null);
        } else { c.fillStyle = 'rgba(28,126,214,.35)'; c.fillRect(x - 2, GY - 16, 4, 18); }
      }
    }
    this.drawSling(c, false);
    // Pearl, waiting (not very patiently) on her snowbank
    const pX = this.pearlX;
    if (pX > cx - 200 && pX < cx + W + 200) {
      c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(pX, GY + 4, 110, 34, 0, Math.PI, TAU); c.fill();
      c.strokeStyle = '#7a4b2a'; c.lineWidth = 3; c.beginPath(); c.moveTo(pX + 74, GY - 16); c.lineTo(pX + 74, GY - 112); c.stroke();
      c.fillStyle = '#ff6b9d'; c.beginPath(); c.moveTo(pX + 74, GY - 112); c.lineTo(pX + 114, GY - 99); c.lineTo(pX + 74, GY - 86); c.closePath(); c.fill();
      heart(c, pX + 88, GY - 99, 12, '#fff');
      this.pearl.x = pX; this.pearl.y = GY - 28; drawSeal(c, pX, GY - 28, this.pearl);
    }
    // bouncy things and treats
    for (const o of this.objs) {
      if (o.x < cx - 150 || o.x > cx + W + 150) continue;
      if (o.k === 'fish') { if (!o.hit) fish(c, o.x, o.y + Math.sin(t * 4 + o.x) * 4, 40, '#ffa94d'); continue; }
      if (o.k === 'beans') { if (!o.hit) { c.save(); c.translate(o.x, o.y + 25); c.scale(.9, .9); drawBeans(c, t); c.restore(); } continue; }
      c.save(); c.translate(o.x, GY + (o.fy || 0));
      if (o.k === 'penguin') { if (o.fly) c.rotate(o.fr); c.scale(1.1, 1.1); drawPenguin(c, t + o.x * .01); }
      else if (o.k === 'spring') drawSpring(c, o.comp);
      else drawWalrus(c, o.awake, o.sq);
      c.restore();
    }
    // Gerald + shadow
    const lift = clamp(1 - (GY - this.py) / 600, .3, 1);
    c.fillStyle = 'rgba(60,110,160,' + (.22 * lift) + ')'; c.beginPath(); c.ellipse(this.px - 4, GY + 3, 60 * g.s * lift, 8 * lift, 0, 0, TAU); c.fill();
    drawSeal(c, this.px, this.py, g);
    this.drawSling(c, true);
    // aim preview dots
    if (this.state === 'aim' && this.drag) {
      const p = this.pull();
      if (Math.hypot(p.dx, p.dy) > 25) {
        let x = this.px, y = this.py - 26, vx = Math.max(150, -p.dx * 8.5), vy = -p.dy * 8.5;
        c.fillStyle = '#ffffff';
        for (let i = 0; i < 26; i++) {
          vy += 1400 * .045; x += vx * .045; y += vy * .045; if (y > GY) break;
          c.globalAlpha = 1 - i / 26; c.beginPath(); c.arc(x, y, 6 - i * .15, 0, TAU); c.fill();
        }
        c.globalAlpha = 1;
      }
    } else if (this.state === 'aim') {
      const k = (t * .7) % 1, e = eIO(Math.min(1, k * 1.6));
      c.globalAlpha = k < .8 ? .85 : (1 - k) * 4;
      c.fillStyle = '#ffffff'; c.strokeStyle = '#1c7ed6'; c.lineWidth = 3;
      c.beginPath(); c.arc(this.px - e * 110, this.py - 30 + e * 70, 20, 0, TAU); c.fill(); c.stroke();
      c.globalAlpha = 1;
    }
    this.P.draw(c);
    c.restore();
    // HUD
    fishPill(c, this.fish);
    for (let i = 0; i < Math.min(this.boosts, 6); i++) { c.save(); c.translate(38 + i * 34, 128); c.scale(.55, .55); drawBeans(c, t); c.restore(); }
    cornerBtns(c, t, true);
    if (this.state !== 'aim') txt(c, Math.max(0, Math.floor((this.px - LX) / PXM)) + ' m', W / 2, 48, 46, '#fff');
    if (this.banner) {
      const b = this.banner, k = Math.min(1, b.t * 3);
      c.save(); c.translate(W / 2, 150); c.scale(eBack(k), eBack(k));
      txt(c, b.txt, 0, 0, 46, '#fff'); if (b.sub) txt(c, b.sub, 0, 50, 28, '#ffe066'); c.restore();
    }
    if (this.hintT > 0 && this.boosts > 0 && this.state === 'fly') {
      c.save(); c.globalAlpha = Math.min(1, this.hintT); txt(c, 'Tap to toot!', W / 2, 110, 38, '#b9dc7e', 'center', '#2b5d12'); c.restore();
    }
    if (this.results) drawResults(c, this.results, t);
  }
};

// ---------- SEAL CHOIR ----------
const NOTES = [262, 294, 330, 349, 392, 440];                     // C D E F G A
const NOTE_COLS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];
const SONGS = [
  { name: 'Twinkle Star', n: [0, 0, 4, 4, 5, 5, 4, 3, 3, 2, 2, 1, 1, 0] },
  { name: 'Little Lamb', n: [2, 1, 0, 1, 2, 2, 2, 1, 1, 1, 2, 4, 4, 2, 1, 0, 1, 2, 2, 2, 2, 1, 1, 2, 1, 0] },
  { name: 'Jingle Bells', n: [2, 2, 2, 2, 2, 2, 2, 4, 0, 1, 2, 3, 3, 3, 3, 3, 2, 2, 2, 2, 1, 1, 2, 1, 4] }
];
const STAGE = 440;
const Choir = {
  enter() {
    Object.assign(this, { t: 0, P: new Parts(), tq: new TQ(), mode: 'free', phase: '', picker: false, song: null, pos: 0,
      seq: [], round: 0, lives: 3, earned: 0, results: null, taps: 0, proj: null, peng: [0, 0, 0, 0], cush: 9 });
    const defs = [{ who: 'chonk', col: '#76889a', s: .8 }, { col: '#a9b7c4' }, { col: '#b8a99a' }, { col: '#8e9fb5' },
      { who: 'gerald', col: GCOL, bowtie: true }, { who: 'squeak', col: '#b3c1cd', s: .56 }];
    this.singers = defs.map(d => { const s = mkSeal(Object.assign({ s: .7 }, d)); if (d.who) wear(s, d.who); s.glow = 0; return s; });
    this.gerald = this.singers[4];
    this.pearl = wear(mkSeal({ s: .7, col: '#eef2f6', belly: '#fff', flip: true, bow: true, lashes: true }), 'pearl');
    this.pearlHat = this.pearl.hat;
    this.modeBtns = [['free', 'Play', '#4dabf7'], ['song', 'Songs', '#f06595'], ['copy', 'Copy Me', '#20c997']]
      .map(([m, label, col]) => new Btn({ w: 150, h: 54, col, label, m }));
    this.cards = SONGS.map((sg, i) => new Btn({ w: 280, h: 78, col: NOTE_COLS[[0, 2, 4][i]], label: sg.name, fs: 30, i }));
    this.banner = { t: 0, txt: 'Tap the seals!' };
    this.layout();
  },
  layout() {
    const n = 6, sp = Math.min(150, (W - 60) / n), x0 = W / 2 - sp * (n - 1) / 2;
    this.cols = this.singers.map((s, i) => ({ x: x0 + i * sp, top: STAGE - 38 - i * 15, w: sp }));
    this.modeBtns.forEach((b, i) => { b.x = W / 2 + (i - 1) * 162; b.y = 46; });
    this.cards.forEach((b, i) => { b.x = W / 2; b.y = H / 2 - 60 + i * 96; });
  },
  resetStage() {
    this.tq.clear(); this.proj = null;
    this.singers.forEach(s => { resetSeal(s); s.glow = 0; }); resetSeal(this.pearl); this.pearl.hat = this.pearlHat;
  },
  setMode(m) {
    this.resetStage(); this.mode = m; this.phase = ''; this.picker = false; this.banner = null;
    if (m === 'free') this.banner = { t: 0, txt: 'Tap the seals!' };
    else if (m === 'song') this.picker = true;
    else this.startCopy();
  },
  play(i) {
    const s = this.singers[i], col = this.cols[i];
    S.note(NOTES[i]); s.glow = 1; s.anim = { type: 'sing', t: 0, dur: .4 };
    this.P.add({ k: 'note', x: s.x + 30, y: col.top - 62, vx: rand(-20, 30), vy: -rand(70, 110), life: 1.2, s: 32, col: NOTE_COLS[i] });
  },
  tapSeal(i) {
    if (this.mode === 'copy') {
      if (this.phase !== 'input') return;
      if (this.seq[this.pos] === i) { this.play(i); this.pos++; if (this.pos === this.seq.length) this.roundWon(); }
      else this.oops(i);
      return;
    }
    this.play(i);
    if (this.mode === 'song' && this.phase === 'play' && i === this.song.n[this.pos]) {
      this.pos++; if (this.pos >= this.song.n.length) this.songDone();
    }
    if (this.mode === 'free') this.taps++;
  },
  // --- Songs: follow the glowing seal ---
  startSong(i) { this.resetStage(); this.picker = false; this.song = SONGS[i]; this.pos = 0; this.phase = 'play'; },
  songDone() {
    this.phase = 'done'; save.fish += 5; persist();
    S.cheer(.3); S.fanfare(.35); this.peng = [1.6, 1.6, 1.6, 1.6];
    this.P.add({ k: 'text', str: '+5', x: 80, y: 110, vy: -40, life: 1.5, s: 40, col: '#ffd43b' });
    this.loveGag(() => { this.picker = true; this.phase = ''; });
  },
  // Gerald serenades Pearl. It goes about as well as usual.
  loveGag(after) {
    const g = this.gerald, p = this.pearl, P = this.P, Q = this.tq;
    Q.add(1.3, () => { g.eyes = 'heart'; S.love(); hearts(P, g.x + 20, g.y - 60, 5); });
    Q.add(1.9, () => {
      S.note(523); S.note(587, .25); g.anim = { type: 'sing', t: 0, dur: .6 };
      for (let k = 0; k < 3; k++) P.add({ k: 'heart', x: g.x + 40, y: g.y - 50, vx: (p.x - g.x - 40) / 1.2 + rand(-30, 30), vy: (p.y - 60 - g.y + 50) / 1.2 + rand(-20, 20), life: 1.2, s: 20 });
    });
    if (Math.random() < .5) {        // earmuffs
      Q.add(2.9, () => { S.hmph(); p.hat = 'muffs'; p.eyes = 'half'; p.rot = -.1; });
      Q.add(3.5, () => { g.eyes = 'closed'; g.mouth = 'frown'; S.sad(); });
    } else {                         // rose, returned to sender
      Q.add(2.5, () => { S.kiss(); this.proj = { x0: g.x + 40, y0: g.y - 50, x1: p.x - 20, y1: p.y - 60, t: 0, dur: .8 }; });
      Q.add(3.35, () => { S.boing(); p.flap = -1.3; p.eyes = 'half'; const q = this.proj; this.proj = { x0: q.x1, y0: q.y1, x1: g.x + 30, y1: g.y - 60, t: 0, dur: .5 }; });
      Q.add(3.6, () => { p.flap = 0; });
      Q.add(3.85, () => { this.proj = null; S.bonk(); stars(P, g.x + 30, g.y - 60); g.eyes = 'x'; });
      Q.add(4.3, () => S.sad());
    }
    Q.add(6.4, () => { resetSeal(g); resetSeal(p); p.hat = this.pearlHat; if (after) after(); });
  },
  // --- Copy Me: Simon says, seal edition ---
  startCopy() { this.resetStage(); this.seq = []; this.round = 0; this.lives = 3; this.earned = 0; this.results = null; this.nextRound(); },
  nextRound() {
    this.round++; let n;
    do { n = irand(0, 5); } while (this.seq.length >= 2 && n === this.seq[this.seq.length - 1] && n === this.seq[this.seq.length - 2]);
    this.seq.push(n); this.playSeq(.9);
  },
  playSeq(dl) {
    this.phase = 'watch'; const gap = Math.max(.45, .75 - this.round * .02);
    this.seq.forEach((n, i) => this.tq.add(dl + i * gap, () => this.play(n)));
    this.tq.add(dl + this.seq.length * gap, () => { this.phase = 'input'; this.pos = 0; });
  },
  roundWon() {
    this.phase = 'good'; this.earned += this.round; save.fish += this.round;
    save.bestChoir = Math.max(save.bestChoir || 0, this.round); persist();
    this.tq.add(.35, () => { S.pop(0, 1.5); this.P.add({ k: 'text', str: '+' + this.round, x: 80, y: 110, vy: -40, life: 1.2, s: 36, col: '#ffd43b' }); this.peng = [.8, .8, .8, .8]; });
    this.tq.add(1.3, () => this.nextRound());
  },
  oops(i) {
    const s = this.singers[i]; this.phase = 'oops'; this.lives--;
    S.fart(); fartCloud(this.P, s.x - 50 * s.s, s.y - 15, 1, 8); s.anim = { type: 'blush', t: 0, dur: 1.2 };
    if (this.lives > 0) {
      this.banner = { t: 0, txt: 'Oops! Listen again' };
      this.tq.add(1.8, () => { this.banner = null; this.playSeq(0); });
    } else {
      this.tq.add(.9, () => S.sad());
      this.tq.add(2.6, () => { this.results = mkResults('You remembered ' + (this.round - 1) + '!', this.earned, save.bestChoir || 0, () => this.startCopy()); });
    }
  },
  down(x, y) {
    if (this.results) { resultsDown(this.results, x, y); return; }
    if (homeBtn.hit(x, y)) { go(Hub); return; }
    if (muteBtn.hit(x, y)) { toggleMute(); return; }
    if (this.picker) {
      for (const b of this.cards) if (b.hit(x, y)) { b.press = 1; S.tap(); this.startSong(b.i); return; }
      this.setMode('free'); return;
    }
    for (const b of this.modeBtns) if (b.hit(x, y)) { b.press = 1; S.tap(); this.setMode(b.m); return; }
    if (y > 150 && y < STAGE + 10) { for (let i = 0; i < 6; i++) if (Math.abs(x - this.cols[i].x) < this.cols[i].w / 2) { this.tapSeal(i); return; } }
    if (Math.hypot(x - 60, y - (H - 40)) < 40 && this.cush > .6) {
      this.cush = 0; S.fart('rip'); fartCloud(this.P, 60, H - 50, -1, 8, true); this.peng = this.peng.map(() => rand(.5, 1)); return;
    }
    const p = this.pearl;
    if (hitSeal(p, x, y) && !p.anim && !this.tq.q.length) react(p, this.P, 'hmph');
  },
  key(k) {
    const i = '123456'.indexOf(k) >= 0 ? '123456'.indexOf(k) : 'asdfgh'.indexOf(k);
    if (i >= 0 && !this.picker && !this.results) this.tapSeal(i);
    if (k === 'Escape') go(Hub);
  },
  update(dt) {

    if (this.proj) this.proj.t += dt;
    this.cush += dt;
    this.peng = this.peng.map(v => Math.max(0, v - dt));
    this.singers.forEach((s, i) => { s.x = this.cols[i].x; s.y = this.cols[i].top + s.dy; s.glow = Math.max(0, s.glow - dt * 2.5); sealTick(s, dt, this.t, this.P); });

  },
  draw(c) {
    const t = this.t;
    // night sky with northern lights
    const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0b1d3a'); sky.addColorStop(.7, '#1d3b6e'); sky.addColorStop(1, '#2d5a8c');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) {
      c.globalAlpha = .4 + .4 * Math.sin(t * 2 + i * 1.7);

    }
    [['rgba(99,230,190,.16)', 0], ['rgba(177,151,252,.14)', 1], ['rgba(116,192,252,.14)', 2]].forEach(([col, b]) => {
      c.fillStyle = col; c.beginPath();
      for (let x = 0; x <= W; x += 20) c.lineTo(x, 110 + b * 45 + Math.sin(x * .008 + t * .4 + b * 2) * 32);
      for (let x = W; x >= 0; x -= 20) c.lineTo(x, 180 + b * 45 + Math.sin(x * .01 + t * .5 + b) * 26);

    });
    c.globalAlpha = 1;

        if (rv > 0) {
          const avg = (A.v + B.v) / 2, e = .45;   // mostly a shove, a little bounce A.v = avg - e * rv / 2; B.v = avg + e * rv / 2;
          if (rv > 250) { S.boing(0, clamp(1.3 - rv / 1000, .6, 1.2)); stars(this.P, (A.x + B.x) / 2, SUMO_Y - 60, 5); A.seal.sq = .15; B.seal.sq = .15; }
        }
        const push = (min - gap) / 2; A.x -= push; B.x += push;
      }
      for (const w of [A, B]) if (!w.falling && Math.abs(w.x - W / 2) > this.R - 10) { this.fall(w); break; }
    }
    for (const w of [A, B]) {
      if (w.falling && !w.surf) {
        w.vy += 1400 * dt; w.y += w.vy * dt; w.x += w.v * dt * .5; w.seal.rot += w.dir * -4 * dt;
        if (!w.spl && w.y > 40) { w.spl = true; S.splash(); splashBurst(this.P, w.x, SUMO_Y + 34, 16); }
      } else if (!w.falling) w.seal.rot = w.lean * .22;
      w.lean = Math.max(0, w.lean - dt * 5);
      w.seal.x = w.x; w.seal.y = SUMO_Y + w.y;
      if (w.seal.sq > 0 && !w.seal.anim) w.seal.sq = Math.max(0, w.seal.sq - dt);
      sealTick(w.seal, dt, this.t, this.P);
    }
    const p = this.pearl; p.x = W - 100; p.y = 352 + Math.sin(this.t * 1.5) * 2; sealTick(p, dt, this.t, this.P);
  },
  draw(c) {
    const t = this.t, R = this.R;
    drawSky(c, 330); drawSun(c, W - 110, 80); drawClouds(c, t); drawFarBergs(c, 330);
    drawSea(c, 330, t);
    // Pearl, judging from her own little floe
    c.fillStyle = '#f7fcff'; c.beginPath(); c.ellipse(W - 100, 356, 72, 12, 0, 0, TAU); c.fill();
    drawSeal(c, this.pearl.x, this.pearl.y, this.pearl);
    // the (shrinking) sumo floe
    c.fillStyle = '#a9d8f0'; c.beginPath(); c.ellipse(W / 2, SUMO_Y + 10, R, R * .2 + 10, 0, 0, TAU); c.fill();
    c.fillStyle = '#f7fcff'; c.beginPath(); c.ellipse(W / 2, SUMO_Y, R, R * .2, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,90,120,.45)'; c.lineWidth = 4; c.beginPath(); c.ellipse(W / 2, SUMO_Y, Math.max(20, R - 30), Math.max(6, R * .2 - 6), 0, 0, TAU); c.stroke();
    for (const w of [this.A, this.B]) {
      if (!w.falling) { c.fillStyle = 'rgba(60,110,160,.18)'; c.beginPath(); c.ellipse(w.x - 5, SUMO_Y + 3, 70 * w.seal.s, 9, 0, 0, TAU); c.fill(); drawSeal(c, w.seal.x, w.seal.y, w.seal); }
      else { c.save(); c.beginPath(); c.rect(0, 0, W, SUMO_Y + 34); c.clip(); drawSeal(c, w.seal.x, w.seal.y, w.seal); c.restore(); }
    }
    this.P.draw(c);
    cornerBtns(c, t, true); fishPill(c, save.fish);
    if (this.state === 'menu') {
      wobblyTitle(c, 'Seal Sumo', W / 2, 130, 70, t);
      this.menu[0].x = W / 2 - 165; this.menu[1].x = W / 2 + 165; this.menu[0].y = this.menu[1].y = 262;
      this.menu.forEach(b => b.draw(c, t));
      txt(c, 'Tap fast to bump Chonk off the ice!', W / 2, 190, 26, '#fff');
    } else if (this.state === 'ready' || this.state === 'fight') {
      const zone = (x, col, label) => {
        c.globalAlpha = .35 + .15 * Math.sin(t * 6); c.fillStyle = col; c.beginPath(); c.arc(x, H - 70, 58, 0, TAU); c.fill(); c.globalAlpha = 1;
        txt(c, label, x, H - 70, 28, '#fff');
      };
      zone(this.cpu ? W / 2 : 90, '#e8590c', 'TAP!');
      if (!this.cpu) { zone(W - 90, '#4dabf7', 'TAP!'); c.strokeStyle = 'rgba(255,255,255,.25)'; c.setLineDash([8, 10]); c.lineWidth = 3; c.beginPath(); c.moveTo(W / 2, 120); c.lineTo(W / 2, H); c.stroke(); c.setLineDash([]); }
    }
    if (this.banner) {
      const b = this.banner, k = Math.min(1, b.t * 3);
      c.save(); c.translate(W / 2, 200); c.scale(eBack(k), eBack(k)); txt(c, b.txt, 0, 0, 90, '#ffe066'); c.restore();
    }
    if (this.results) drawResults(c, this.results, t);
  }
};

// ---------- FISH SHOP ----------
const WHO = [
  { id: 'gerald', name: 'Gerald', col: GCOL, bowtie: true },
  { id: 'pearl', name: 'Pearl', col: '#eef2f6', belly: '#fff', bow: true, lashes: true },
  { id: 'chonk', name: 'Chonk', col: '#76889a' },
  { id: 'squeak', name: 'Squeak', col: '#b3c1cd' }
];
const Shop = {
  enter() {
    this.t = 0; this.P = new Parts(); this.tq = new TQ(); this.wi = this.wi || 0; this.shake = {}; this.flash = 0; this.peng = 0;
    this.prev = new Btn({ w: 62, h: 62, round: true, col: '#f2994a', icon: 'prev' });
    this.next = new Btn({ w: 62, h: 62, round: true, col: '#f2994a', icon: 'next' });
    this.setModel(); this.layout();
  },
  setModel() { const d = WHO[this.wi]; this.model = wear(mkSeal(Object.assign({ s: 1.3 }, d)), d.id); },
  outfit() { const id = WHO[this.wi].id; return save.outfit[id] || (save.outfit[id] = {}); },
  layout() {
    const x0 = Math.max(W * .47, 380), gap = 12, tile = Math.min(112, (W - x0 - 24 - gap * 3) / 4);
    this.tiles = ITEMS.map((it, i) => ({ it, s: tile, x: x0 + (i % 4) * (tile + gap) + tile / 2, y: 150 + Math.floor(i / 4) * (tile + gap) + tile / 2 }));
    this.mx = Math.min(W * .24, x0 - 190);
  },
  update(dt) {
    this.t += dt; now = this.t; this.P.update(dt); this.tq.update(dt); this.layout();
    const m = this.model; m.x = this.mx; m.y = 440; sealTick(m, dt, this.t, this.P);
    this.prev.x = this.mx - 125; this.next.x = this.mx + 125; this.prev.y = this.next.y = 528;
    for (const k in this.shake) { this.shake[k] -= dt; if (this.shake[k] <= 0) delete this.shake[k]; }
    if (this.flash > 0) this.flash -= dt;
    if (this.peng > 0) this.peng -= dt;
  },
  cycle(d) {
    this.wi = (this.wi + d + WHO.length) % WHO.length; this.setModel();
    S.swish(); S.honk([1, 1.2, .72, 1.5][this.wi], .1); this.model.anim = { type: 'hop', t: 0, dur: .55 };
  },
  tapItem(tl) {
    const it = tl.it, o = this.outfit(), m = this.model, owned = save.owned.indexOf(it.id) >= 0;
    if (owned) {
      if (o[it.slot] === it.id) { delete o[it.slot]; S.whistle(false, 0, .3); }
      else { o[it.slot] = it.id; equipSound(it.id); m.anim = { type: 'hop', t: 0, dur: .55 }; }
    } else if (save.fish >= it.price) {
      save.fish -= it.price; save.owned.push(it.id); o[it.slot] = it.id;
      S.chaching(); equipSound(it.id, .45); this.peng = .9;
      for (let k = 0; k < Math.min(it.price, 8); k++) this.tq.add(k * .05, () => this.P.add({ k: 'fish', x: 50, y: 45, vx: (tl.x - 50) / .45, vy: (tl.y - 45) / .45, life: .45, s: 26, fade: false }));
      this.tq.add(.45, () => { stars(this.P, tl.x, tl.y, 8); m.anim = { type: 'hop', t: 0, dur: .55 }; hearts(this.P, m.x + 30, m.y - 110, 4); });
    } else {
      this.shake[it.id] = .5; this.flash = .9; S.nope(); m.anim = { type: 'sad', t: 0, dur: .9 };
    }
    persist(); wear(m, WHO[this.wi].id);
  },
  down(x, y) {
    if (homeBtn.hit(x, y)) { go(Hub); return; }
    if (muteBtn.hit(x, y)) { toggleMute(); return; }
    if (this.prev.hit(x, y)) { this.prev.press = 1; this.cycle(-1); return; }
    if (this.next.hit(x, y)) { this.next.press = 1; this.cycle(1); return; }
    for (const tl of this.tiles) if (Math.abs(x - tl.x) < tl.s / 2 && Math.abs(y - tl.y) < tl.s / 2) { this.tapItem(tl); return; }
    const m = this.model;
    if (hitSeal(m, x, y) && !m.anim) {
      if (m.face === 'nose') { S.clown(); m.anim = { type: 'hop', t: 0, dur: .55 }; }
      else react(m, this.P);
    }
  },
  key(k) { if (k === 'ArrowLeft') this.cycle(-1); if (k === 'ArrowRight') this.cycle(1); if (k === 'Escape') go(Hub); },
  draw(c) {
    const t = this.t, T = performance.now() / 1000, o = this.outfit();
    // ice-shack wall, floor, awning
    c.fillStyle = '#d7eefb'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(120,170,210,.25)'; c.lineWidth = 2;
    for (let y = 100; y < 470; y += 46) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.fillStyle = '#b9dcf2'; c.fillRect(0, 470, W, H - 470);
    const sw = 60;
    for (let x = 0, i = 0; x < W + sw; x += sw, i++) { c.fillStyle = i % 2 ? '#ffffff' : '#ff6b6b'; c.fillRect(x, 0, sw, 50); c.beginPath(); c.arc(x + sw / 2, 50, sw / 2, 0, Math.PI); c.fill(); }
    // rug, model seal, shopkeeper
    c.fillStyle = '#f783ac'; c.beginPath(); c.ellipse(this.mx, 446, 150, 26, 0, 0, TAU); c.fill();
    c.fillStyle = '#faa2c1'; c.beginPath(); c.ellipse(this.mx, 444, 124, 18, 0, 0, TAU); c.fill();
    drawSeal(c, this.model.x, this.model.y, this.model);
    const px = Math.min(this.mx + 160, this.tiles[0].x - this.tiles[0].s / 2 - 34);
    c.save(); c.translate(px, 478 - (this.peng > 0 ? Math.abs(Math.sin(this.peng * 12)) * 20 : 0)); c.scale(1.15, 1.15); drawPenguin(c, this.peng > 0 ? t * 3 : t); c.restore();
    // stock
    for (const tl of this.tiles) {
      const it = tl.it, s = tl.s, owned = save.owned.indexOf(it.id) >= 0, worn = o[it.slot] === it.id, afford = save.fish >= it.price;
      const sh = this.shake[it.id] ? Math.sin(this.shake[it.id] * 50) * 7 : 0;
      c.save(); c.translate(tl.x + sh, tl.y);
      c.fillStyle = 'rgba(0,0,0,.12)'; rr(c, -s / 2, -s / 2 + 5, s, s, 18); c.fill();
      c.fillStyle = worn ? '#d3f9d8' : '#ffffff'; rr(c, -s / 2, -s / 2, s, s, 18); c.fill();
      if (worn) { c.strokeStyle = '#2fb45a'; c.lineWidth = 5; rr(c, -s / 2, -s / 2, s, s, 18); c.stroke(); }
      c.save(); if (!owned && !afford) c.globalAlpha = .45;
      const k = s / 76 * (it.icS || 1); c.translate(0, owned ? 0 : -10); c.scale(k, k); c.translate(-it.ic[0], -it.ic[1]); it.draw(c, T);
      c.restore();
      if (!owned) {
        c.fillStyle = afford ? '#ffe8cc' : '#ffe3e3'; rr(c, -s * .38, s / 2 - 27, s * .76, 22, 11); c.fill();
        fish(c, -s * .18, s / 2 - 16, 22, '#ffa94d');
        txt(c, String(it.price), s * .1, s / 2 - 15, 19, afford ? '#d9480f' : '#c92a2a', 'center', null);
      } else {
        c.fillStyle = worn ? '#2fb45a' : '#b2f2bb'; c.beginPath(); c.arc(s / 2 - 14, -s / 2 + 14, 11, 0, TAU); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(s / 2 - 19, -s / 2 + 14); c.lineTo(s / 2 - 15, -s / 2 + 18); c.lineTo(s / 2 - 8, -s / 2 + 9); c.stroke();
      }
      c.restore();
    }
    this.P.draw(c);
    // HUD
    wobblyTitle(c, 'Fish Shop', this.mx, 112, 54, t);
    fishPill(c, save.fish);
    if (this.flash > 0 && Math.floor(this.flash * 8) % 2) { c.strokeStyle = '#fa5252'; c.lineWidth = 5; rr(c, 16, 16, 80 + String(save.fish).length * 21, 58, 29); c.stroke(); }
    cornerBtns(c, t, true);
    this.prev.draw(c, t); this.next.draw(c, t);
    txt(c, WHO[this.wi].name, this.mx, 528, 32, '#fff');
  }
};

// =====================================================================
//  MAIN LOOP & INPUT
// =====================================================================
function toWorld(e) { return [e.clientX / SCALE, e.clientY / SCALE]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); S.init();
  if (next || portrait || !scene || !scene.down) return;
  const [x, y] = toWorld(e); scene.down(x, y, e);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (next || portrait || !scene || !scene.move) return;
  const [x, y] = toWorld(e); scene.move(x, y);
});
const pointerUp = e => { if (!scene || !scene.up) return; const [x, y] = toWorld(e); scene.up(x, y); };
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat) return; S.init();
  if (!next && scene && scene.key) scene.key(e.key);
  if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
});
document.addEventListener('visibilitychange', () => {
  if (!S.ctx) return;
  if (document.hidden) S.ctx.suspend(); else S.ctx.resume();
});

function drawRotateHint(c) {
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = cv.width / DPR, h = cv.height / DPR;
  c.fillStyle = '#0c4a7e'; c.fillRect(0, 0, w, h);
  c.save(); c.translate(w / 2, h / 2 - 40); c.rotate(-Math.PI / 2 * eIO((Math.sin(performance.now() / 600) + 1) / 2));
  c.fillStyle = '#fff'; rr(c, -45, -70, 90, 140, 14); c.fill(); c.fillStyle = '#3aa0dd'; rr(c, -36, -58, 72, 116, 6); c.fill(); c.restore();
  txt(c, 'Turn me sideways!', w / 2, h / 2 + 90, 30, '#fff');
}

let last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  if (next) { fade += dt * 5; if (fade >= 1) { fade = 1; scene = next; next = null; scene.enter(); } }
  else fade = Math.max(0, fade - dt * 4);
  if (!portrait && scene) scene.update(dt);
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  if (scene) scene.draw(ctx);
  if (fade > 0) { ctx.fillStyle = 'rgba(12,74,126,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
  if (portrait) drawRotateHint(ctx);
  requestAnimationFrame(frame);
}
scene = Title; scene.enter();
requestAnimationFrame(frame);
</script>
